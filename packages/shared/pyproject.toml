[project]
name = "gank-shared"
version = "0.1.0"
description = "Shared ESI client, EVE SSO, static universe data, and schemas for gank-alert"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gank_shared"]

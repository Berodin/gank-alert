name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages --group dev
      - run: uv run --group dev pytest -v

  build-images:
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [gank-ingester, gank-bot, gank-api]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: |
            APP=${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}

  build-client:
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: gank-alert-linux
          - os: windows-latest
            artifact: gank-alert-windows.exe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --package gank-client
      - name: Build binary
        working-directory: apps/client
        run: uv run pyinstaller gank_client.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/client/dist/gank-alert
            apps/client/dist/gank-alert.exe
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/gank-alert-linux/gank-alert
            artifacts/gank-alert-windows.exe/gank-alert.exe

services:
  traefik:
    image: traefik:v3.2
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt

  ingester:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: gank-ingester
    restart: unless-stopped
    environment:
      GANK_DB_PATH: /data/gank_alert.sqlite3
    volumes:
      - gank_data:/data

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: gank-bot
    restart: unless-stopped
    depends_on:
      - ingester
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      GANK_DB_PATH: /data/gank_alert.sqlite3
    volumes:
      - gank_data:/data

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        APP: gank-api
    restart: unless-stopped
    depends_on:
      - ingester
    environment:
      GANK_EVE_CLIENT_ID: ${GANK_EVE_CLIENT_ID}
      GANK_EVE_REDIRECT_URI: ${GANK_EVE_REDIRECT_URI}
      GANK_DB_PATH: /data/gank_alert.sqlite3
    volumes:
      - gank_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.gank-api.rule=Host(`${GANK_API_DOMAIN}`)
      - traefik.http.routers.gank-api.entrypoints=websecure
      - traefik.http.routers.gank-api.tls.certresolver=le
      - traefik.http.services.gank-api.loadbalancer.server.port=8000

volumes:
  gank_data:
  traefik_certs:

[project]
name = "gank-client"
version = "0.1.0"
description = "Cross-platform desktop app: EVE SSO login, live location, region gank feed"
requires-python = ">=3.12"
dependencies = [
    "gank-shared",
    "PySide6>=6.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pyinstaller>=6.10"]

[tool.uv.sources]
gank-shared = { workspace = true }

[project.scripts]
gank-client = "gank_client.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gank_client"]

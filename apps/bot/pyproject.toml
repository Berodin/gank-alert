[project]
name = "gank-bot"
version = "0.1.0"
description = "Discord bot: posts region gank alerts sourced from the ingester's DB"
requires-python = ">=3.12"
dependencies = [
    "gank-shared",
    "discord.py>=2.4",
]

[tool.uv.sources]
gank-shared = { workspace = true }

[project.scripts]
gank-bot = "gank_bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gank_bot"]

[project]
name = "gank-api"
version = "0.1.0"
description = "EVE SSO (PKCE) login, character location ingest, region gank feed"
requires-python = ">=3.12"
dependencies = [
    "gank-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.uv.sources]
gank-shared = { workspace = true }

[project.scripts]
gank-api = "gank_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gank_api"]
